# Team guardrails in CI (installed by nextpak-skills). Runs on every PR and push to main:
# - secrets: gitleaks (CLI, MIT, no licence key needed) on the new commits
# - agent-config: flags PRs that change agent or guardrail config, so a lead reviews them
# Add your project's own test and lint jobs in a separate workflow (see guardrails/README.md).
name: AI guardrails

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ai-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="$PUSH_AFTER"
          fi
          echo "Scanning $range"
          gitleaks git --redact --no-banner --verbose --log-opts="$range" .

  agent-config:
    name: Agent config changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed agent and guardrail files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$PR_BASE" "$PR_HEAD" | grep -E '^(\.guardrails/|\.claude/|\.codex/|\.agents/|\.mcp\.json$|\.github/workflows/|AGENTS\.md$|CLAUDE\.md$|dbhub\.toml$)' || true)"
          if [ -z "$changed" ]; then
            echo "No agent or guardrail config changed."
            exit 0
          fi
          {
            echo "### Agent or guardrail config changed: needs a lead's review"
            echo
            echo "A local MCP server or hook is a command that runs on every developer's machine."
            echo "Check each new command, URL and permission before approving."
            echo
            echo "$changed" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$changed" | while read -r f; do echo "::warning file=$f::Agent/guardrail config changed; a lead must review this file."; done
